            backdrop-filter: blur(16px);

        }

            animation: pulse-height 1.5s ease-in-out infinite;

        }

<body class="bg-background text-on-surface font-body-md min-h-screen flex flex-col selection:bg-primary-fixed-dim">
<!-- TopAppBar Shell -->
<header class="fixed top-0 left-0 w-full z-50 flex justify-between items-center px-gutter h-16 bg-surface/80 backdrop-blur-md shadow-sm">
<button class="w-10 h-10 flex items-center justify-center rounded-full transition-all duration-300 ease-in-out active:scale-95 hover:bg-surface-variant/50">
<span class="material-symbols-outlined text-primary">close</span>
</button>
<h1 class="font-headline-md text-headline-md text-primary font-semibold">Voice Coach</h1>
<button class="w-10 h-10 flex items-center justify-center rounded-full transition-all duration-300 ease-in-out active:scale-95 hover:bg-surface-variant/50">
<span class="material-symbols-outlined text-primary">settings</span>
</button>
</header>
<main class="flex-grow pt-24 pb-32 px-container-margin max-w-lg mx-auto w-full flex flex-col items-center gap-8">
<!-- Voice Activity Header -->
<section class="w-full flex flex-col items-center justify-center gap-4">
<div class="relative flex items-center justify-center">
<div class="absolute w-24 h-24 bg-primary-container rounded-full blur-2xl opacity-40 animate-pulse"></div>
<div class="relative w-16 h-16 bg-gradient-to-tr from-primary to-primary-container rounded-full flex items-center justify-center orb-glow shadow-lg">
<div class="flex items-end gap-1 h-8">
<div class="waveform-bar w-1 bg-on-primary-container rounded-full" style="animation-delay: 0s"></div>
<div class="waveform-bar w-1 bg-on-primary-container rounded-full" style="animation-delay: 0.2s"></div>
<div class="waveform-bar w-1 bg-on-primary-container rounded-full" style="animation-delay: 0.4s"></div>
<div class="waveform-bar w-1 bg-on-primary-container rounded-full" style="animation-delay: 0.1s"></div>
<div class="waveform-bar w-1 bg-on-primary-container rounded-full" style="animation-delay: 0.3s"></div>
</div>
</div>
</div>
<p class="font-label-md text-label-md text-on-surface-variant tracking-wider">Listening for <span class="text-primary font-bold">"Next Step"</span>...</p>
</section>
<!-- Current Step Card & Timer Layout -->
<div class="w-full relative">
<!-- Step Card -->
<div class="bg-surface shadow-[0_12px_24px_-10px_rgba(26,25,21,0.08)] rounded-[32px] p-8 border border-outline-variant/20 flex flex-col items-center text-center gap-6 min-h-[380px] justify-center relative overflow-hidden">
<div class="absolute top-0 left-0 w-full h-1 bg-primary-container"></div>
<span class="bg-primary-container/20 text-on-primary-container px-4 py-1 rounded-full font-label-sm text-label-sm uppercase tracking-widest">Instruction</span>
<h2 class="font-headline-lg text-headline-lg text-on-surface leading-snug">
                    Step 3: Gently fold the saffron-infused rice into the vegetable medley.
                </h2>
<!-- Timer Overlay (Contextual) -->
<div class="mt-4 flex flex-col items-center gap-3">
<div class="relative w-32 h-32 flex items-center justify-center">
<svg class="absolute inset-0 w-full h-full -rotate-90">
<circle class="text-outline-variant/20" cx="64" cy="64" fill="transparent" r="58" stroke="currentColor" stroke-width="4"></circle>
<circle class="text-primary" cx="64" cy="64" fill="transparent" r="58" stroke="currentColor" stroke-dasharray="364" stroke-dashoffset="120" stroke-width="4"></circle>
</svg>
<div class="text-center">
<span class="block font-headline-md text-headline-md text-primary">05:00</span>
<span class="block font-label-sm text-label-sm text-on-surface-variant uppercase">Simmer</span>
</div>
</div>
</div>
</div>
<!-- Side Floating Ingredient View (Glassmorphism) -->
<div class="absolute -right-4 -bottom-6 glass-panel border border-white/50 shadow-xl rounded-2xl p-5 w-48 z-10 flex flex-col gap-3">
<div class="flex items-center justify-between">
<span class="font-label-md text-label-md text-primary">Next Items</span>
<span class="material-symbols-outlined text-[18px] text-on-surface-variant">shopping_basket</span>
</div>
<ul class="space-y-2">
<li class="flex items-center gap-2 text-on-surface">
<span class="material-symbols-outlined text-[16px] text-secondary">check_circle</span>
<span class="text-label-sm font-label-sm">Saffron Rice</span>
</li>
<li class="flex items-center gap-2 text-on-surface">
<span class="material-symbols-outlined text-[16px] text-secondary">check_circle</span>
<span class="text-label-sm font-label-sm">Veg Medley</span>
</li>
</ul>
</div>
</div>

<div class="absolute inset-0 bg-gradient-to-t from-black/60 to-transparent flex items-end p-4">
<p class="text-white font-label-md text-label-md">Visual Reference: Folding Texture</p>
</div>
</div>
</div>
</main>
<!-- Hands-Free Navigation / Controls -->

<button class="flex flex-col items-center justify-center gap-1 transition-transform duration-200 active:scale-90 text-on-surface-variant group">
<div class="w-12 h-12 rounded-full border border-outline-variant flex items-center justify-center group-hover:bg-surface-variant">
<span class="material-symbols-outlined">arrow_back</span>
</div>
<span class="font-label-sm text-label-sm">Back</span>
</button>
<button class="flex flex-col items-center justify-center gap-1 transition-transform duration-200 active:scale-90 text-on-primary-container">
<div class="w-16 h-16 rounded-full bg-primary-container shadow-lg flex items-center justify-center">
<span class="material-symbols-outlined text-[32px]" data-weight="fill">pause</span>
</div>
<span class="font-label-sm text-label-sm font-bold">Pause AI</span>
</button>
<button class="flex flex-col items-center justify-center gap-1 transition-transform duration-200 active:scale-90 text-on-surface-variant group">
<div class="w-12 h-12 rounded-full border border-outline-variant flex items-center justify-center group-hover:bg-surface-variant">
<span class="material-symbols-outlined">arrow_forward</span>
</div>
<span class="font-label-sm text-label-sm">Next</span>
</button>
</footer>
