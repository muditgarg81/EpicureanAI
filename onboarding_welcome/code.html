<div class="fixed inset-0 -z-10 overflow-hidden">

<div class="absolute top-1/2 -left-48 w-[500px] h-[500px] bg-secondary-container/10 rounded-full blur-[120px]"></div>
<div class="absolute -bottom-24 right-1/4 w-80 h-80 bg-tertiary-container/10 rounded-full blur-[80px]"></div>
</div>
<!-- Onboarding Container -->
<main class="relative w-full max-w-lg mx-auto flex flex-col min-h-screen px-container-margin py-xl">
<!-- High-Impact Welcome Header -->
<div class="flex flex-col items-center text-center space-y-md mb-lg">
<div class="relative w-64 h-64 md:w-80 md:h-80 group">
<!-- Main 3D Logo Component -->
<div class="absolute inset-0 bg-primary-container/10 rounded-full scale-110 blur-xl"></div>
<img alt="Modern Kitchen Logo" class="relative z-10 w-full h-full object-contain drop-shadow-2xl transition-transform duration-700 hover:scale-105" src="https://lh3.googleusercontent.com/aida/ADBb0ujn_83LAew_GKyQkCJB7Wn0k838Cee1BZKTw13xxfMJP2xH2JjmhVObESYlSSJ-aLuN-cTqhm8juWIC8bmG-Jhi5TUBMCje8AeIKPpj9J2j5WIc4MUT1DUpG1LDXQtWWkdS8wW4ASKv_nAwjK39JeTM8Bnn6dciQeZNgZ-4sWxymEO4h03UeEoU74yR-7Y9Wuq5LKlqmTbYxTPo3L1nrgutbzuTNGGLf3DR37Hb3N58OvTetXeLsd9e-GWDEPK-QLAQWnKIhnko"/>
</div>
<div class="space-y-base max-w-xs">
<h1 class="font-display-lg text-display-lg text-on-background leading-tight">
                    Modern Kitchen
                </h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">
                    Master the World's Kitchens with AI.
                </p>
</div>
</div>
<!-- Value Proposition Bento Grid -->
<section class="grid grid-cols-2 gap-gutter mb-xl">
<!-- Glass Card 1 -->
<div class="glass-panel p-md rounded-xl flex flex-col items-start space-y-xs shadow-sm">
<span class="material-symbols-outlined text-primary text-3xl" data-icon="auto_awesome">auto_awesome</span>
<p class="font-label-md text-label-md text-on-background">AI Recipes</p>
<p class="font-label-sm text-label-sm text-on-surface-variant">Personalized flavors.</p>
</div>
<!-- Glass Card 2 -->
<div class="glass-panel p-md rounded-xl flex flex-col items-start space-y-xs shadow-sm">
<span class="material-symbols-outlined text-secondary text-3xl" data-icon="language">language</span>
<p class="font-label-md text-label-md text-on-background">Global Taste</p>
<p class="font-label-sm text-label-sm text-on-surface-variant">Authentic spices.</p>
</div>
<!-- Glass Card 3 (Full Width) -->
<div class="glass-panel col-span-2 p-md rounded-xl flex items-center space-x-md shadow-sm">
<div class="bg-tertiary-container/30 p-sm rounded-full">
<span class="material-symbols-outlined text-tertiary text-2xl" data-icon="restaurant_menu">restaurant_menu</span>
</div>
<div>
<p class="font-label-md text-label-md text-on-background">Intelligent Substitutions</p>
<p class="font-label-sm text-label-sm text-on-surface-variant">Cook with what you have in your pantry.</p>
</div>
</div>
</section>
<!-- CTA Section -->
<div class="mt-auto pt-lg space-y-md">
<button class="w-full h-16 bg-primary-container text-on-primary-container font-label-md text-label-md rounded-full flex items-center justify-center space-x-base shadow-lg active:scale-95 transition-all duration-200 hover:brightness-105">
<span>Get Started</span>
<span class="material-symbols-outlined" data-icon="arrow_forward">arrow_forward</span>
</button>
<div class="flex justify-center items-center space-x-base">
<span class="w-2 h-2 bg-primary rounded-full"></span>
<span class="w-2 h-2 bg-outline-variant rounded-full"></span>
<span class="w-2 h-2 bg-outline-variant rounded-full"></span>
</div>
<p class="text-center font-label-sm text-label-sm text-on-surface-variant px-md">
                By continuing, you agree to our <a class="text-primary font-bold" href="#">Terms of Service</a> and <a class="text-primary font-bold" href="#">Privacy Policy</a>.
